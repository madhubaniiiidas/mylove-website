<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For My Kuchupuchu ♡</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Quicksand', sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #ffe4ec 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #dff6ff 0%, transparent 30%),
        linear-gradient(135deg, #fce4ec, #e8def8, #dff4f3);

      position: relative;
    }

    /* Soft glowing blobs */

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(5px);
      opacity: 0.55;
      animation: blobMove 8s ease-in-out infinite alternate;
    }

    .blob.one {
      width: 220px;
      height: 220px;
      background: #ffd6e7;
      top: -60px;
      left: -50px;
    }

    .blob.two {
      width: 280px;
      height: 280px;
      background: #d8e9ff;
      bottom: -100px;
      right: -70px;
      animation-delay: 2s;
    }

    .blob.three {
      width: 160px;
      height: 160px;
      background: #e8dcff;
      top: 40%;
      right: 5%;
      animation-delay: 4s;
    }

    @keyframes blobMove {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(30px, -25px) scale(1.12);
      }
    }

    /* Main card */

    .card {
      width: min(90%, 650px);
      padding: 55px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 40px;

      box-shadow:
        0 25px 70px rgba(160, 120, 150, 0.18),
        inset 0 0 30px rgba(255, 255, 255, 0.5);

      position: relative;
      z-index: 5;

      animation: cardAppear 1.5s cubic-bezier(.17,.67,.32,1.3);
    }

    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.85);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Heart */

    .heart {
      font-size: 70px;
      display: inline-block;

      animation:
        heartbeat 1.5s ease-in-out infinite,
        floating 4s ease-in-out infinite;

      filter: drop-shadow(0 8px 10px rgba(255, 120, 160, 0.25));
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    @keyframes floating {
      0%, 100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -10px;
      }
    }

    /* Main heading */

    h1 {
      margin-top: 20px;

      color: #c77d9b;

      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.25;
      font-weight: 700;

      letter-spacing: 1px;

      text-shadow:
        2px 3px 0px rgba(255, 255, 255, 0.8),
        0 5px 20px rgba(199, 125, 155, 0.18);

      animation: textReveal 1.8s ease forwards;
    }

    @keyframes textReveal {
      0% {
        opacity: 0;
        letter-spacing: 10px;
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        letter-spacing: 1px;
        filter: blur(0);
      }
    }

    /* Love message */

    .love {
      margin-top: 25px;

      color: #9a7bb5;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;

      line-height: 1.5;

      animation: fadeUp 2s ease 0.6s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signature {
      margin-top: 30px;

      color: #a78b9d;
      font-family: 'Sacramento', cursive;
      font-size: 30px;

      animation: fadeUp 2s ease 1s both;
    }

    /* Sparkles */

    .sparkle {
      position: absolute;
      color: white;
      font-size: 18px;
      animation: sparkle 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0.5) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.3) rotate(180deg);
      }
    }

    /* Floating hearts */

    .floating-heart {
      position: absolute;
      bottom: -50px;

      font-size: 22px;

      opacity: 0;

      animation: rise 8s linear infinite;

      z-index: 1;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      50% {
        transform: translateY(-50vh) translateX(30px) rotate(15deg);
      }

      100% {
        transform: translateY(-110vh) translateX(-40px) rotate(-20deg);
        opacity: 0;
      }
    }

    /* Small decorative dots */

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.8);

      animation: dotFloat 5s ease-in-out infinite;
    }

    @keyframes dotFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    /* Mobile */

    @media (max-width: 500px) {
      .card {
        padding: 45px 20px;
        border-radius: 30px;
      }

      .heart {
        font-size: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- Background blobs -->

  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>


  <!-- Floating hearts -->

  <div class="floating-heart" style="left: 5%; animation-delay: 0s;">♡</div>
  <div class="floating-heart" style="left: 15%; animation-delay: 2s;">♥</div>
  <div class="floating-heart" style="left: 30%; animation-delay: 4s;">♡</div>
  <div class="floating-heart" style="left: 48%; animation-delay: 1s;">💕</div>
  <div class="floating-heart" style="left: 65%; animation-delay: 3s;">♡</div>
  <div class="floating-heart" style="left: 80%; animation-delay: 5s;">♥</div>
  <div class="floating-heart" style="left: 92%; animation-delay: 1.5s;">♡</div>


  <!-- Sparkles -->

  <div class="sparkle" style="top: 12%; left: 15%; animation-delay: 0s;">✦</div>
  <div class="sparkle" style="top: 25%; right: 15%; animation-delay: 1s;">✧</div>
  <div class="sparkle" style="bottom: 18%; left: 12%; animation-delay: 2s;">✦</div>
  <div class="sparkle" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">✧</div>
  <div class="sparkle" style="top: 8%; right: 40%; animation-delay: 2.5s;">✦</div>


  <!-- Decorative dots -->

  <div class="dot" style="top: 18%; left: 30%;"></div>
  <div class="dot" style="top: 70%; left: 8%; animation-delay: 1s;"></div>
  <div class="dot" style="top: 15%; right: 8%; animation-delay: 2s;"></div>
  <div class="dot" style="bottom: 12%; right: 30%; animation-delay: 3s;"></div>


  <!-- Main Card -->

  <div class="card">

    <div class="heart">💗</div>

    <h1>
      HAPPYYYYY<br>
      BOYFRIEND'S DAYYYY<br>
      MY KUCHUPUCHU 🥹💕
    </h1>

    <div class="love">
      I LOVE YOU SO MUCH<br>
      MWAHHHHH 💋💗
    </div>

    <div class="signature">
      forever & always, my love ♡
    </div>

  </div>

</body>
</html>
